<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b1120">
<title>定位签到</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  :root{
    --bg:#0b1120;--card:#151f33;--line:#26344d;
    --txt:#e6edf7;--sub:#8b9ab5;--ok:#22c55e;--warn:#f59e0b;--bad:#ef4444;--pri:#3b82f6;
  }
  body{
    margin:0;background:var(--bg);color:var(--txt);
    font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    max-width:520px;margin:0 auto;padding:16px 16px 40px;
  }
  h1{font-size:19px;margin:4px 0 16px;font-weight:600}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
  .row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:5px 0;font-size:14px}
  .label{color:var(--sub);flex:none}
  .val{text-align:right;word-break:break-all}
  hr{border:0;border-top:1px solid var(--line);margin:10px 0}
  .status{margin-top:12px;padding:10px 12px;border-radius:10px;text-align:center;font-weight:600;font-size:14px;background:#1d2a42;color:var(--sub)}
  .status.ok{background:rgba(34,197,94,.15);color:var(--ok)}
  .status.warn{background:rgba(245,158,11,.15);color:var(--warn)}
  .status.bad{background:rgba(239,68,68,.15);color:var(--bad)}
  .btn{width:100%;padding:17px;font-size:17px;font-weight:700;letter-spacing:4px;border:0;border-radius:14px;background:var(--pri);color:#fff;margin-bottom:12px;cursor:pointer;transition:.15s;font-family:inherit}
  .btn:disabled{background:#243149;color:#5b6b85;cursor:not-allowed}
  .btn:not(:disabled):active{transform:scale(.98)}
  .mini{padding:9px 12px;font-size:13px;border-radius:9px;border:1px solid var(--line);background:#1d2a42;color:var(--txt);cursor:pointer;font-family:inherit}
  .mini.primary{background:var(--pri);border-color:var(--pri);color:#fff}
  .mini.danger{background:transparent;color:var(--bad);border-color:rgba(239,68,68,.4)}
  .field{display:grid;gap:6px;font-size:13px;color:var(--sub)}
  .field input,.field select,.field textarea{width:100%;padding:11px;border-radius:9px;border:1px solid var(--line);background:#0e1728;color:var(--txt);font-size:15px;font-family:inherit}
  .field textarea{resize:vertical}
  .field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--pri)}
  .field.check{display:flex;align-items:center;gap:8px}
  .field.check input{width:auto}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{padding:9px 14px;border-radius:20px;border:1px solid var(--line);background:#0e1728;color:var(--txt);font-size:14px;cursor:pointer;font-family:inherit}
  .chip.active{background:var(--pri);border-color:var(--pri);color:#fff}
  .stat-row{display:flex;gap:10px}
  .stat{flex:1;text-align:center;padding:10px 4px;background:#0e1728;border-radius:10px}
  .stat-num{font-size:26px;font-weight:700}
  .stat-num.ok{color:var(--ok)}
  .stat-num.bad{color:var(--bad)}
  .stat-lbl{font-size:12px;color:var(--sub);margin-top:2px}
  .person{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 12px;border-radius:9px;background:#0e1728;margin-bottom:6px;font-size:14px}
  .person.absent{color:var(--bad);font-weight:600}
  .rec{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:13px}
  .rec:first-child{border-top:0}
  .rec-ok{color:var(--ok);font-weight:700}
  .rec-name{font-weight:600;font-size:14px}
  .rec-sub{color:var(--sub);font-size:12px;margin-top:2px}
  .empty{color:var(--sub);font-size:13px;text-align:center;padding:14px 0}
  .tabs{display:flex;gap:6px;margin-bottom:12px}
  .tab{flex:1;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--sub);font-size:14px;cursor:pointer;font-family:inherit}
  .tab.active{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:600}
  .loc-item{padding:12px}
  .badge{display:inline-block;padding:1px 6px;border-radius:4px;background:rgba(239,68,68,.2);color:var(--bad);font-size:11px;margin-left:6px}
  .error{color:var(--bad);font-size:13px;margin-top:8px}
  .btns{display:flex;gap:8px}
  .btns .mini{flex:1}
  .form-grid{display:grid;gap:10px}
  .topbanner{background:rgba(239,68,68,.15);color:var(--bad);border:1px solid rgba(239,68,68,.4);
    padding:10px 12px;border-radius:10px;font-size:13px;margin-bottom:12px;display:flex;
    justify-content:space-between;align-items:center;gap:10px}
  .topbanner.hidden{display:none}
</style>
</head>
<body>

<div id="globalError" class="topbanner hidden">
  <span id="globalErrorMsg"></span>
  <button class="mini" id="globalRetry">重试</button>
</div>

<!-- ==================== 签到页 ==================== -->
<div id="pageCheckin">
  <h1>📍 定位签到</h1>

  <div class="card">
    <div class="label" style="margin-bottom:10px">选择签到点</div>
    <div id="locChips" class="chips"><div class="empty">加载中…</div></div>
  </div>

  <div class="card">
    <div class="row"><span class="label">签到点</span><span class="val" id="pName">—</span></div>
    <div class="row"><span class="label">时间窗口</span><span class="val" id="pTime">—</span></div>
    <div class="row"><span class="label">当前时间</span><span class="val" id="now">—</span></div>
    <hr>
    <div class="row"><span class="label">定位精度</span><span class="val" id="acc">—</span></div>
    <div class="row"><span class="label">距签到点</span><span class="val" id="dist">—</span></div>
    <div class="status" id="status">正在获取位置…</div>
  </div>

  <div class="card">
    <label class="field">
      <span>你的姓名</span>
      <input id="nameInput" list="rosterDatalist" placeholder="点击选择或输入姓名" autocomplete="off">
      <datalist id="rosterDatalist"></datalist>
    </label>
  </div>

  <button class="btn" id="btn" disabled>签 到</button>
  <button class="mini" id="toAdmin" style="width:100%">🔒 管理员</button>
</div>

<!-- ==================== 管理员登录 ==================== -->
<div id="pageAdminLogin" hidden>
  <h1>🔒 管理员登录</h1>
  <div class="card">
    <label class="field">
      <span>管理密码</span>
      <input id="pwdInput" type="password" placeholder="请输入管理密码">
    </label>
    <div id="pwdError" class="error" hidden></div>
    <div class="btns" style="margin-top:14px">
      <button class="mini" id="backFromLogin">← 返回</button>
      <button class="mini primary" id="loginBtn">登录</button>
    </div>
  </div>
</div>

<!-- ==================== 管理员面板 ==================== -->
<div id="pageAdmin" hidden>
  <h1>⚙️ 管理员面板</h1>

  <div class="tabs">
    <button class="tab active" data-tab="stats">统计</button>
    <button class="tab" data-tab="locations">签到点</button>
    <button class="tab" data-tab="roster">名单</button>
  </div>

  <!-- 统计 -->
  <div id="tabStats" class="tab-panel">
    <div class="card">
      <label class="field">
        <span>选择签到点</span>
        <select id="statsLocSelect"></select>
      </label>
    </div>
    <div class="card">
      <div class="stat-row">
        <div class="stat"><div class="stat-num" id="sTotal">0</div><div class="stat-lbl">应到</div></div>
        <div class="stat"><div class="stat-num ok" id="sDone">0</div><div class="stat-lbl">已到</div></div>
        <div class="stat"><div class="stat-num bad" id="sAbsent">0</div><div class="stat-lbl">未到</div></div>
      </div>
    </div>
    <div class="card">
      <div class="row"><span class="label">未签到名单</span><button class="mini" id="refreshStats">刷新</button></div>
      <div id="absentList"></div>
    </div>
    <div class="card">
      <div class="row"><span class="label">已签到（<span id="doneCount">0</span>）</span></div>
      <div id="doneList"></div>
    </div>
  </div>

  <!-- 签到点管理 -->
  <div id="tabLocations" class="tab-panel" hidden>
    <button class="mini primary" id="addLocBtn" style="width:100%;margin-bottom:12px">+ 添加签到点</button>
    <div id="locList"></div>

    <div id="locForm" class="card" hidden>
      <div class="label" id="locFormTitle" style="margin-bottom:10px">添加签到点</div>
      <div class="form-grid">
        <label class="field"><span>名称</span><input id="fLocName" placeholder="例如：公司大门"></label>
        <label class="field"><span>纬度</span><input id="fLocLat" type="number" step="0.000001"></label>
        <label class="field"><span>经度</span><input id="fLocLng" type="number" step="0.000001"></label>
        <label class="field"><span>允许半径（米）</span><input id="fLocRadius" type="number" value="200"></label>
        <label class="field"><span>开始时间</span><input id="fLocStart" type="datetime-local"></label>
        <label class="field"><span>结束时间</span><input id="fLocEnd" type="datetime-local"></label>
        <label class="field check"><input id="fLocActive" type="checkbox" checked><span>启用</span></label>
      </div>
      <div class="btns" style="margin-top:14px">
        <button class="mini" id="locFormCancel">取消</button>
        <button class="mini" id="useCurPos">用当前位置</button>
        <button class="mini primary" id="locFormSave">保存</button>
      </div>
    </div>
  </div>

  <!-- 名单管理 -->
  <div id="tabRoster" class="tab-panel" hidden>
    <div class="card">
      <label class="field">
        <span>批量导入（每行一个，或用逗号、空格分隔）</span>
        <textarea id="rosterImport" rows="6" placeholder="张三&#10;李四&#10;王五&#10;…"></textarea>
      </label>
      <div class="btns" style="margin-top:10px">
        <button class="mini primary" id="importBtn">导入</button>
        <button class="mini danger" id="clearRosterBtn">清空名单</button>
      </div>
    </div>
    <div class="card">
      <div class="row"><span class="label">当前名单（<span id="rosterCount">0</span> 人）</span></div>
      <div id="rosterListBox"></div>
    </div>
  </div>

  <button class="mini" id="adminLogout" style="width:100%;margin-top:12px">退出管理</button>
</div>

<script>
(function () {
  'use strict';

  /* ==================================================================
     ① Supabase 配置（必填）
     ================================================================== */
  const SUPABASE_URL      = 'https://你的项目.supabase.co';
  const SUPABASE_ANON_KEY = '你的 anon public key';
  /* ================================================================== */

  /* 管理员密码（直接写在代码里） */
  const ADMIN_PASSWORD = 'PKMT5';

  /* ==================== 工具 ==================== */
  const $  = s => document.querySelector(s);
  const $$ = s => document.querySelectorAll(s);

  const p2 = n => String(n).padStart(2, '0');
  const fmtClock  = d => { d = new Date(d); return `${p2(d.getHours())}:${p2(d.getMinutes())}:${p2(d.getSeconds())}`; };
  const fmtDT     = d => { d = new Date(d); return `${d.getMonth()+1}月${d.getDate()}日 ${p2(d.getHours())}:${p2(d.getMinutes())}`; };
  const fmtDTFull = d => { d = new Date(d); return `${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())} ${p2(d.getHours())}:${p2(d.getMinutes())}`; };
  const toInputDT = d => { d = new Date(d); return `${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}T${p2(d.getHours())}:${p2(d.getMinutes())}`; };
  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  function haversine(lat1, lng1, lat2, lng2) {
    const R = 6371000, rad = d => d * Math.PI / 180;
    const dLat = rad(lat2 - lat1), dLng = rad(lng2 - lng1);
    const a = Math.sin(dLat/2)**2 + Math.cos(rad(lat1)) * Math.cos(rad(lat2)) * Math.sin(dLng/2)**2;
    return 2 * R * Math.asin(Math.sqrt(a));
  }
  const fmtDist = m => m < 1000 ? `${Math.round(m)} 米` : `${(m/1000).toFixed(2)} 公里`;

  /* ==================== 全局错误提示 ==================== */
  function showGlobalError(msg) {
    const box = $('#globalError');
    $('#globalErrorMsg').textContent = msg;
    box.classList.remove('hidden');
  }
  function hideGlobalError() {
    $('#globalError').classList.add('hidden');
  }

  /* ==================== 设备指纹（安全版） ==================== */
  function getDeviceId() {
    let id = null;
    try { id = localStorage.getItem('checkin.deviceId'); } catch (e) {}
    if (id) return id;

    let rand;
    try {
      if (typeof crypto !== 'undefined' && typeof crypto.randomUUID === 'function') {
        rand = crypto.randomUUID();
      } else if (typeof crypto !== 'undefined' && typeof crypto.getRandomValues === 'function') {
        const buf = new Uint8Array(16);
        crypto.getRandomValues(buf);
        rand = Array.from(buf).map(b => b.toString(16).padStart(2, '0')).join('');
      } else {
        rand = String(Date.now()) + '_' + Math.random().toString(36).slice(2);
      }
    } catch (e) {
      rand = String(Date.now()) + '_' + Math.random().toString(36).slice(2);
    }
    id = 'dev_' + rand;
    try { localStorage.setItem('checkin.deviceId', id); } catch (e) {}
    return id;
  }
  const DEVICE_ID = getDeviceId();

  /* ==================== Supabase 请求 ==================== */
  const API_HEADERS = {
    'apikey': SUPABASE_ANON_KEY,
    'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
    'Content-Type': 'application/json'
  };

  async function sb(path, opts = {}) {
    const headers = Object.assign({}, API_HEADERS, opts.headers || {});
    const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, Object.assign({}, opts, { headers }));
    const text = await res.text();
    let data = null;
    if (text) { try { data = JSON.parse(text); } catch (e) { data = text; } }
    if (!res.ok) {
      const err = new Error((data && data.message) || (typeof data === 'string' ? data : '') || ('HTTP ' + res.status));
      err.status = res.status;
      err.code = data && data.code;
      throw err;
    }
    return data;
  }

  /* ==================== 全局状态 ==================== */
  let locations = [];
  let roster = [];
  let currentLocId = null;
  let signedNames = new Set();
  let deviceSigned = false;
  let pos = null;
  let flash = null;
  let adminAuthed = false;
  let statsLocId = null;
  let adminCheckins = [];
  let editingLocId = null;
  let lastChipsKey = '';

  /* ==================== 数据加载（各自兜错） ==================== */
  async function loadLocations() {
    try {
      const data = await sb('locations?select=*&order=id.asc');
      locations = data || [];
      hideGlobalError();
      return true;
    } catch (err) {
      locations = [];
      showGlobalError('读取签到点失败：' + err.message);
      return false;
    }
  }
  async function loadRoster() {
    try {
      const data = await sb('roster?select=*&order=name.asc');
      roster = data || [];
      updateRosterDatalist();
      return true;
    } catch (err) {
      roster = [];
      updateRosterDatalist();
      showGlobalError('读取名单失败：' + err.message);
      return false;
    }
  }
  async function loadSignedNames(locId) {
    try {
      const rows = await sb(`checkins?location_id=eq.${locId}&select=name`) || [];
      return new Set(rows.map(r => r.name));
    } catch (e) {
      return new Set();
    }
  }
  async function loadDeviceSigned(locId) {
    try {
      const rows = await sb(`checkins?location_id=eq.${locId}&device_id=eq.${encodeURIComponent(DEVICE_ID)}&select=id`) || [];
      return rows.length > 0;
    } catch (e) {
      return false;
    }
  }

  function updateRosterDatalist() {
    const dl = $('#rosterDatalist');
    if (!dl) return;
    dl.innerHTML = roster.map(r => `<option value="${esc(r.name)}">`).join('');
  }

  /* ==================== 签到页渲染 ==================== */
  function setStatus(msg, cls) {
    const el = $('#status');
    if (!el) return;
    el.textContent = msg;
    el.className = 'status' + (cls ? ' ' + cls : '');
  }
  function setFlash(msg, cls, ms) {
    flash = { msg, cls, until: Date.now() + (ms || 3000) };
    setStatus(msg, cls);
  }

  function renderChips() {
    const box = $('#locChips');
    if (!box) return;
    const key = locations.map(l => l.id + (l.id === currentLocId ? '*' : '')).join(',');
    if (key === lastChipsKey) return;
    lastChipsKey = key;

    const active = locations.filter(l => l.active);
    if (!active.length) {
      box.innerHTML = '<div class="empty">暂无可用签到点</div>';
      return;
    }
    box.innerHTML = active.map(l =>
      `<button class="chip${l.id === currentLocId ? ' active' : ''}" data-id="${l.id}">${esc(l.name)}</button>`
    ).join('');
    box.querySelectorAll('.chip').forEach(b => {
      b.addEventListener('click', () => switchLocation(+b.dataset.id));
    });
  }

  function switchLocation(id) {
    currentLocId = id;
    try { localStorage.setItem('checkin.lastLoc', id); } catch (e) {}
    signedNames = new Set();
    deviceSigned = false;
    renderCheckin();
    Promise.all([loadSignedNames(id), loadDeviceSigned(id)])
      .then(([names, devSigned]) => {
        signedNames = names;
        deviceSigned = devSigned;
        renderCheckin();
      })
      .catch(() => {});
  }

  function renderCheckin() {
    try {
      renderChips();

      const loc = locations.find(l => l.id === currentLocId);
      const $now = $('#now');
      if ($now) $now.textContent = fmtClock(new Date());

      if (!loc) {
        $('#pName').textContent = '—';
        $('#pTime').textContent = '—';
        $('#dist').textContent = '—';
        $('#acc').textContent = '—';
        $('#btn').disabled = true;
        return;
      }

      $('#pName').textContent = loc.name;
      $('#pTime').textContent = `${fmtDT(loc.start_time)} ~ ${fmtDT(loc.end_time)}`;

      let dist = null;
      if (pos) {
        dist = haversine(pos.lat, pos.lng, loc.lat, loc.lng);
        $('#dist').textContent = fmtDist(dist);
        $('#acc').textContent = `±${Math.round(pos.acc)} 米`;
      } else {
        $('#dist').textContent = '—';
        $('#acc').textContent = '—';
      }

      const now = new Date();
      const s = new Date(loc.start_time), e = new Date(loc.end_time);
      const nameInput = $('#nameInput');
      const name = nameInput ? nameInput.value.trim() : '';
      const nameOk = roster.some(r => r.name === name);
      const already = signedNames.has(name);
      const inTime = now >= s && now <= e;
      const inRange = dist !== null && dist <= loc.radius;

      $('#btn').disabled = !(nameOk && inTime && inRange && !already && !deviceSigned);

      if (flash && Date.now() < flash.until) { setStatus(flash.msg, flash.cls); return; }
      flash = null;

      if (!pos) { setStatus('正在获取位置…', ''); return; }
      if (deviceSigned) { setStatus('🚫 这台设备已经签到过了，不能替他人签到', 'bad'); return; }
      if (!name) { setStatus('请在下方选择你的姓名', 'warn'); return; }
      if (!nameOk) { setStatus('姓名不在应到名单里', 'bad'); return; }
      if (already) { setStatus('✅ 你已经签到过了', 'ok'); return; }
      if (!inTime) {
        if (now < s) setStatus('⏳ 签到尚未开始', 'warn');
        else setStatus('⏰ 签到时间已结束', 'bad');
        return;
      }
      if (!inRange) { setStatus(`📍 距离签到点还有 ${fmtDist(dist)}，需进入 ${loc.radius} 米内`, 'warn'); return; }
      setStatus('✅ 已进入签到范围，可以签到', 'ok');
    } catch (e) {
      // 渲染错误不应导致整页崩溃
      console.error('renderCheckin error:', e);
    }
  }

  /* ==================== 定位 ==================== */
  function startWatch() {
    if (!navigator.geolocation) { setStatus('当前浏览器不支持定位', 'bad'); return; }
    navigator.geolocation.watchPosition(
      p => { pos = { lat: p.coords.latitude, lng: p.coords.longitude, acc: p.coords.accuracy }; renderCheckin(); },
      err => {
        pos = null;
        const map = { 1: '定位权限被拒绝，请在浏览器设置里允许定位', 2: '无法获取位置信息', 3: '定位超时，请重试' };
        setStatus(map[err.code] || ('定位失败：' + err.message), 'bad');
        renderCheckin();
      },
      { enableHighAccuracy: true, timeout: 15000, maximumAge: 5000 }
    );
  }

  /* ==================== 签到 ==================== */
  async function doCheckIn() {
    const loc = locations.find(l => l.id === currentLocId);
    if (!loc) return setFlash('请先选择签到点', 'bad');

    const name = $('#nameInput').value.trim();
    if (!roster.some(r => r.name === name)) return setFlash('请从名单中选择你的姓名', 'bad');
    if (!pos) return setFlash('还没获取到位置
